name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Your idea for a solution, screenshots or examples from other panels are welcome.
