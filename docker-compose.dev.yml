# Development services: docker compose -f docker-compose.dev.yml up -d
name: loadstone-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: loadstone
      POSTGRES_PASSWORD: loadstone
      POSTGRES_DB: loadstone
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ layout; the old v16 dev volume ("postgres") is left untouched.
      - postgres18:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: loadstone
      MINIO_ROOT_PASSWORD: loadstone-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

volumes:
  postgres18:
  minio:
